<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webcluster-Snake</title>
    <link rel="stylesheet" href="snake.css">
    <script src="snake.js"></script>
</head>
<body>
    <h1>SNAKE GAME</h1>
    <canvas id="board"></canvas>



    <script src="bgm.js"></script>
    <!--For Retro Game Background AutoPlay-->
     <div id="splash" onclick="startSplash()">
         Click Anywhere To Start The Game! Use Arrow Keys to Play!!
     </div>

<!--Background Music from pixabay-->
   <audio id="bgm" src="bgm.mp3" loop></audio>

   <!--Background Video From Pinterest -->
   <video id="snakebg" autoplay muted loop>
    <source src="./gamesbackground.mp4">
</video>
<div id="bgoverlay"></div>

</body>
</html>
