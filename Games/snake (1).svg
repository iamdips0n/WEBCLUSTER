<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <g id="coil1"><ellipse cx="150" cy="238" rx="105" ry="36"/></g>
    <g id="coil2"><ellipse cx="150" cy="198" rx="80" ry="29"/></g>
    <g id="coil3"><ellipse cx="150" cy="162" rx="55" ry="22"/></g>
    <path id="neck" d="M150,165 L150,100"/>
  </defs>

  <!-- Black outlines -->
  <g fill="none" stroke="#000" stroke-width="42" stroke-linecap="round">
    <use href="#coil1"/><use href="#coil2"/><use href="#coil3"/><use href="#neck"/>
  </g>
  <!-- Orange bodies, drawn bottom to top -->
  <g fill="none" stroke="#FF9F1C" stroke-width="32" stroke-linecap="round">
    <use href="#coil1"/>
  </g>
  <g fill="none" stroke="#B34700" stroke-width="10" stroke-dasharray="1 22" stroke-linecap="round">
    <use href="#coil1"/>
  </g>
  <g fill="none" stroke="#000" stroke-width="42"><use href="#coil2"/></g>
  <g fill="none" stroke="#FF9F1C" stroke-width="32"><use href="#coil2"/></g>
  <g fill="none" stroke="#B34700" stroke-width="10" stroke-dasharray="1 22" stroke-linecap="round"><use href="#coil2"/></g>
  <g fill="none" stroke="#000" stroke-width="42"><use href="#coil3"/></g>
  <g fill="none" stroke="#FF9F1C" stroke-width="32"><use href="#coil3"/></g>
  <g fill="none" stroke="#B34700" stroke-width="10" stroke-dasharray="1 22" stroke-linecap="round"><use href="#coil3"/></g>
  <g fill="none" stroke="#FF9F1C" stroke-width="32" stroke-linecap="round"><use href="#neck"/></g>

  <!-- Head -->
  <ellipse cx="150" cy="72" rx="44" ry="34" fill="#FF9F1C" stroke="#000" stroke-width="8"/>

  <!-- Eyes -->
  <circle cx="134" cy="62" r="10" fill="#fff" stroke="#000" stroke-width="3"/>
  <circle cx="166" cy="62" r="10" fill="#fff" stroke="#000" stroke-width="3"/>
  <circle cx="136" cy="63" r="4.5" fill="#000"/>
  <circle cx="164" cy="63" r="4.5" fill="#000"/>

  <!-- Smile -->
  <path d="M134,84 Q150,98 166,84" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
