<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Spiral body: black outline, orange fill, brown spots -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path id="body" d="M40,150 C40,60 260,50 260,150 C260,245 60,255 60,150 C60,95 215,90 215,150 C215,195 105,195 105,150 C105,128 140,128 150,150"
          stroke="#000" stroke-width="42"/>
    <path d="M40,150 C40,60 260,50 260,150 C260,245 60,255 60,150 C60,95 215,90 215,150 C215,195 105,195 105,150 C105,128 140,128 150,150"
          stroke="#FF9F1C" stroke-width="32"/>
    <path d="M40,150 C40,60 260,50 260,150 C260,245 60,255 60,150 C60,95 215,90 215,150 C215,195 105,195 105,150 C105,128 140,128 150,150"
          stroke="#B34700" stroke-width="12" stroke-dasharray="1 24"/>
  </g>

  <!-- Head -->
  <ellipse cx="156" cy="150" rx="26" ry="21" fill="#FF9F1C" stroke="#000" stroke-width="7"/>

  <!-- Forked tongue -->
  <path d="M180,150 L196,150 M196,150 L204,144 M196,150 L204,156"
        stroke="#E5212B" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <circle cx="158" cy="141" r="6" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <circle cx="160" cy="141" r="2.6" fill="#000"/>
  <circle cx="158" cy="159" r="6" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <circle cx="160" cy="159" r="2.6" fill="#000"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
