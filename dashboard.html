<body>

    <!--Dropdown menu for mobile users :)-->

        <li><a href="https://github.com/iamdips0n target="_blank" rel="noopener"">Devloper</a></li>

<!--The Webcluster and the description in middle-->
   <main>
    <section id="hero">
        <h1 class="slide-in">WEBCLUSTER</h1>
        <p>Just Made For Chilling, Want to Play Games?? </p>

<!--adding an music player to the dashboard!!!-->
<div id="player-text">
    <h3 id="player-title">Music Player</h3>

        <div id="mplayer">
    <img id="covers" src="./Music/Earrings.jpg" />
    <div id="songName">Song</div>
    <div id="artist">Artist</div>

    <input id="playback" type="range">

    <!--Icons From https://fontawesome.com/search?ic=free-collection-->
    <div id="nav-buttons">
        <i id="shuffle" class="fa-solid fa-shuffle"></i>
        <i id="previous" class="fa-solid fa-backward fa-1.5x"></i>
        <i id="playSong" class="fa-solid fa-play fa-2x"></i>
        <i id="next" class="fa-solid fa-forward fa-1.5x"></i>
        <i id="repeat" class="fa-solid fa-repeat"></i>
    </div>
    </div>


    
</div>
    </section>
   </main>

   <!--Button Properties-->
   <script>
    const toggleBtn = document.querySelector('.toggle_btn')
    const toggleBtnIcon = document.querySelector('.toggle_btn i')
    const dropDownMenu = document.querySelector('.dropdown_menu')

    toggleBtn.onclick = function() {
        dropDownMenu.classList.toggle('open')
        const isOpen = dropDownMenu.classList.contains('open')

        toggleBtnIcon.classList = isOpen
        ? 'fa-solid fa-xmark'
        : 'fa-solid fa-bars'
    }
   </script>
<!--Cool Japanese Lofi BackGround Song From Youtube-->
   <audio id="bgm" src="WEBCLUSTERHOME.mp3" loop></audio>

</body>
