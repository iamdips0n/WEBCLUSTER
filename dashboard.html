<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="dashboard.css" />
    <title>WebCluster-Home</title>
</head>

<script src="bgm.js"></script>
<body>

    <!-- SPLASH SCREEN-->
     <div id="splash" onclick="start()">
         Click Anywhere To Start!
     </div>


   <header>
    <div class="navbar">
        <div class="logo"><a href="#">iamdips0n</a></div>
        <ul class="links">
            <li><a href="https://github.com/iamdips0n" target="_blank" rel="noopener">Devloper</a></li>
            <li><a href="https://phantom.hackclub.com/?ref=tGLGH">Phantom</a></li>
            <li><a href="Games">Games</a></li>
            <li><a href="https://github.com/iamdips0n/WEBCLUSTER" target="_blank" rel="noopener">GitHub</a></li>
        </ul>
        <a href="#" class="action_btn">Start Playing</a>
        <div class="toggle_btn">
            <i class="fa-solid fa-bars"></i>
        </div>
    </div>
    <div class="dropdown_menu">
        <li><a href="https://github.com/iamdips0n target="_blank" rel="noopener"">Devloper</a></li>
            <li><a href="https://phantom.hackclub.com/?ref=tGLGH">Phantom</a></li>
            <li><a href="Games">Games</a></li>
            <li><a href="https://github.com/iamdips0n/WEBCLUSTER" target="_blank" rel="noopener">GitHub</a></li>
            <li> <a href="#" class="action_btn">Start Playing</a></li> 
    </div>
   </header> 

   <main>
    <section id="hero">
        <h1 class="slide-in">WEBCLUSTER</h1>
        <p>Just Made For Chilling, Want to Play Games?? </p>
    </section>
   </main>

   <script>
    const toggleBtn = document.querySelector('.toggle_btn')
    const toggleBtnIcon = document.querySelector('.toggle_btn i')
    const dropDownMenu = document.querySelector('.dropdown_menu')

    toggleBtn.onclick = function() {
        dropDownMenu.classList.toggle('open')
        const isOpen = dropDownMenu.classList.contains('open')

        toggleBtnIcon.classList = isOpen
        ? 'fa-solid fa-xmark'
        : 'fa-solid fa-bars'
    }
   </script>

   <audio id="bgm" src="WEBCLUSTERHOME.mp3" loop></audio>
</body>
</html>
